name: Native Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
      - name: Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build and test native APK
        run: ./scripts/build-android.sh
      - name: Verify no web assets
        run: |
          if unzip -Z1 android/app/build/outputs/apk/debug/app-debug.apk | grep -E '\.(html|js|wasm)$'; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: sshepherd-native-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
